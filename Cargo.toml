[package]
name = "voxel_engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
# `app-harness` pulls a windowed UI stack: winit for window/input,
# egui for immediate-mode panels + plots, and egui-ash-renderer
# (with the gpu-allocator feature so it shares our existing
# allocator) for the Vulkan paint side. Sim-engine consumers that
# don't render in a window stay off this feature and pay nothing.
app-harness = [
    "dep:winit",
    "dep:egui",
    "dep:egui-winit",
    "dep:egui-ash-renderer",
    "dep:egui_plot",
]
compile-shaders = []
tracing = ["dep:tracing"]

[dependencies]
ash = "0.38"
ash-window = "0.13"
gpu-allocator = { version = "0.28", features = ["vulkan"] }
raw-window-handle = "0.6"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
thiserror = "2"
anyhow = "1"
dot_vox = "5"

# Optional — `app-harness` feature.
winit = { version = "0.30", optional = true }
egui = { version = "0.33", optional = true }
egui-winit = { version = "0.33", optional = true }
egui-ash-renderer = { version = "0.11", default-features = false, features = ["gpu-allocator"], optional = true }
egui_plot = { version = "0.33", optional = true }
tracing = { version = "0.1", optional = true }

[build-dependencies]
shaderc = "0.8"

[dev-dependencies]
env_logger = "0.11"
